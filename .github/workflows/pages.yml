name: Publish model
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Download and verify original model
        run: |
          mkdir -p site/models
          cp LICENSE site/LICENSE
          curl --fail --location --retry 5 --output site/models/birefnet-general.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/BiRefNet-general-epoch_244.onnx
          echo '7a35a0141cbbc80de11d9c9a28f52697  site/models/birefnet-general.onnx' | md5sum --check
          sha256sum site/models/birefnet-general.onnx | tee site/model.sha256
          echo '<h1>Cutout BiRefNet general model</h1><a href="https://bigrooo.github.io/cutout-web/">Open Cutout</a>' > site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
